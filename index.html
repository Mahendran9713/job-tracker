<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, mobile-first Job Application Tracker with offline localStorage, JSON backups, analytics, and interview alerts.">
  <title>Job Application Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #8b5cf6;
      --bg: #0f172a;
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 75%); min-height: 100vh; padding-bottom: 40px; }
    
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--surface-border); }
    h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--surface-border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .metric-card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-border); padding: 18px; border-radius: var(--radius); text-align: center; }
    .metric-card span { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .metric-card h2 { font-size: 1.8rem; margin-top: 6px; color: #fff; }

    .controls-card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-border); padding: 15px; border-radius: var(--radius); margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--surface-border); color: white; font-size: 0.95rem; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--surface-border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }

    .cards-list { display: flex; flex-direction: column; gap: 15px; }
    .card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 20px; transition: transform 0.2s; position: relative; }
    .card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.2); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .card-subtitle { font-size: 0.95rem; color: var(--text-muted); margin-top: 2px; }
    
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-applied { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .badge-screening { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
    .badge-tech { background: rgba(139, 92, 246, 0.2); color: #ddd6fe; }
    .badge-offer { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; font-size: 0.85rem; color: var(--text-muted); }
    .card-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-overlay.hidden { display: none; }
    .modal-content { background: #1e293b; border: 1px solid var(--surface-border); border-radius: var(--radius); width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 25px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--surface-border); color: white; }
    
    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head
